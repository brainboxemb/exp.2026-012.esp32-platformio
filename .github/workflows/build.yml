name: Build ESP32 baseline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: PlatformIO (esp32dev)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Build firmware
        run: pio run -e esp32dev
      - name: Report firmware size
        run: pio run -e esp32dev -t size
