name: Build ESP32 baseline

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: PlatformIO (esp32dev)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0

      # Fresh CI runner: platform/toolchain/framework packages are not cached.
      # This timing therefore includes downloading and installing dependencies.
      - name: Qualify five-panel geometry (native C++)
        shell: bash
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/test_hub75_geometry.cpp -o /tmp/test_hub75_geometry
          /tmp/test_hub75_geometry

      - name: Initial build (including tool downloads)
        id: initial
        shell: bash
        run: |
          start=$(date +%s%3N)
          pio run -e esp32dev
          elapsed_ms=$(( $(date +%s%3N) - start ))
          echo "ms=$elapsed_ms" >> "$GITHUB_OUTPUT"
          echo "Initial build: ${elapsed_ms} ms"

      # Rebuild every project object, but keep the downloaded platform and
      # framework packages installed in the same CI runner.
      - name: Clean rebuild (installed tools)
        id: clean
        shell: bash
        run: |
          pio run -e esp32dev -t clean
          start=$(date +%s%3N)
          pio run -e esp32dev
          elapsed_ms=$(( $(date +%s%3N) - start ))
          echo "ms=$elapsed_ms" >> "$GITHUB_OUTPUT"
          echo "Clean rebuild: ${elapsed_ms} ms"

      - name: Unchanged incremental build
        id: incremental
        shell: bash
        run: |
          start=$(date +%s%3N)
          pio run -e esp32dev
          elapsed_ms=$(( $(date +%s%3N) - start ))
          echo "ms=$elapsed_ms" >> "$GITHUB_OUTPUT"
          echo "No-change build: ${elapsed_ms} ms"

      # The driver library is an opt-in second environment: same runner,
      # same installed Arduino toolchain, no GFX or additional application libs.
      - name: Initial HUB75 build (library install and compilation)
        id: hub75_initial
        shell: bash
        run: |
          start=$(date +%s%3N)
          pio run -e esp32dev-hub75
          elapsed_ms=$(( $(date +%s%3N) - start ))
          echo "ms=$elapsed_ms" >> "$GITHUB_OUTPUT"
          echo "HUB75 initial build: ${elapsed_ms} ms"

      - name: Clean HUB75 rebuild (dependencies already installed)
        id: hub75_clean
        shell: bash
        run: |
          pio run -e esp32dev-hub75 -t clean
          start=$(date +%s%3N)
          pio run -e esp32dev-hub75
          elapsed_ms=$(( $(date +%s%3N) - start ))
          echo "ms=$elapsed_ms" >> "$GITHUB_OUTPUT"
          echo "HUB75 clean rebuild: ${elapsed_ms} ms"

      - name: Unchanged HUB75 incremental build
        id: hub75_incremental
        shell: bash
        run: |
          start=$(date +%s%3N)
          pio run -e esp32dev-hub75
          elapsed_ms=$(( $(date +%s%3N) - start ))
          echo "ms=$elapsed_ms" >> "$GITHUB_OUTPUT"
          echo "HUB75 no-change build: ${elapsed_ms} ms"

      # Third opt-in environment: LVGL 9.6 configured for RGB565/label only.
      - name: Initial LVGL + HUB75 build (LVGL download and compilation)
        id: lvgl_initial
        shell: bash
        run: |
          start=$(date +%s%3N)
          set -o pipefail
          pio run -e esp32dev-hub75-lvgl | tee /tmp/lvgl_initial_build.log
          elapsed_ms=$(( $(date +%s%3N) - start ))
          echo "ms=$elapsed_ms" >> "$GITHUB_OUTPUT"
          echo "LVGL initial build: ${elapsed_ms} ms"

          # Source code is explicitly filtered by scripts/lvgl_source_filter.py.
          # Fail CI if the entire 551-source upstream package is built again.
          sources=$(grep -Ec '^Compiling .*\/lvgl\/' /tmp/lvgl_initial_build.log || true)
          echo "sources=$sources" >> "$GITHUB_OUTPUT"
          echo "LVGL source objects compiled: $sources"
          if (( sources < 70 || sources > 140 )); then
            echo "::error::Unexpected LVGL source count $sources (expected 70..140; unfiltered v9.6.0 builds 551)."
            exit 1
          fi
          if grep -Eq '^Compiling .*\/lvgl\/(drivers|libs|widgets\/button|font\/lv_font_montserrat)' /tmp/lvgl_initial_build.log; then
            echo "::error::Unwanted LVGL module was compiled; source filter needs review."
            exit 1
          fi

      - name: Clean LVGL + HUB75 rebuild (dependencies installed)
        id: lvgl_clean
        shell: bash
        run: |
          pio run -e esp32dev-hub75-lvgl -t clean
          start=$(date +%s%3N)
          pio run -e esp32dev-hub75-lvgl
          elapsed_ms=$(( $(date +%s%3N) - start ))
          echo "ms=$elapsed_ms" >> "$GITHUB_OUTPUT"
          echo "LVGL clean rebuild: ${elapsed_ms} ms"

      - name: Unchanged LVGL + HUB75 incremental build
        id: lvgl_incremental
        shell: bash
        run: |
          start=$(date +%s%3N)
          pio run -e esp32dev-hub75-lvgl
          elapsed_ms=$(( $(date +%s%3N) - start ))
          echo "ms=$elapsed_ms" >> "$GITHUB_OUTPUT"
          echo "LVGL no-change build: ${elapsed_ms} ms"

      - name: Report baseline, HUB75 and LVGL firmware size
        shell: bash
        run: |
          pio run -e esp32dev -t size | tee /tmp/baseline_size.txt
          pio run -e esp32dev-hub75 -t size | tee /tmp/hub75_size.txt
          pio run -e esp32dev-hub75-lvgl -t size | tee /tmp/lvgl_size.txt

      - name: Record build-time comparison
        if: always()
        shell: bash
        env:
          INITIAL_MS: ${{ steps.initial.outputs.ms }}
          CLEAN_MS: ${{ steps.clean.outputs.ms }}
          INCREMENTAL_MS: ${{ steps.incremental.outputs.ms }}
          HUB75_INITIAL_MS: ${{ steps.hub75_initial.outputs.ms }}
          HUB75_CLEAN_MS: ${{ steps.hub75_clean.outputs.ms }}
          HUB75_INCREMENTAL_MS: ${{ steps.hub75_incremental.outputs.ms }}
          LVGL_INITIAL_MS: ${{ steps.lvgl_initial.outputs.ms }}
          LVGL_CLEAN_MS: ${{ steps.lvgl_clean.outputs.ms }}
          LVGL_INCREMENTAL_MS: ${{ steps.lvgl_incremental.outputs.ms }}
          LVGL_COMPILED_SOURCES: ${{ steps.lvgl_initial.outputs.sources }}
        run: |
          {
            echo "## ESP32 Arduino PlatformIO build times"
            echo
            echo "| Measurement | Seconds | What is included |"
            echo "| --- | ---: | --- |"
            if [[ -n "$INITIAL_MS" ]]; then
              printf '| Initial build | %.2f | Platform/toolchain downloads, install, compile, link |\n' "$(awk "BEGIN {print $INITIAL_MS / 1000}")"
            else
              echo "| Initial build | Failed | See build log |"
            fi
            if [[ -n "$CLEAN_MS" ]]; then
              printf '| Clean rebuild | %.2f | Fully rebuild after clean; tools already installed |\n' "$(awk "BEGIN {print $CLEAN_MS / 1000}")"
            else
              echo "| Clean rebuild | Failed/not run | See build log |"
            fi
            if [[ -n "$INCREMENTAL_MS" ]]; then
              printf '| No-change build | %.2f | Existing build output reused |\n' "$(awk "BEGIN {print $INCREMENTAL_MS / 1000}")"
            else
              echo "| No-change build | Failed/not run | See build log |"
            fi
            echo
            echo
            echo "### HUB75 DMA extension (same runner)"
            echo
            echo "| Measurement | Seconds |"
            echo "| --- | ---: |"
            for item in "initial:$HUB75_INITIAL_MS" "clean:$HUB75_CLEAN_MS" "no-change:$HUB75_INCREMENTAL_MS"; do
              name="${item%%:*}"
              value="${item#*:}"
              if [[ -n "$value" ]]; then
                printf '| %s | %.2f |\n' "$name" "$(awk "BEGIN {print $value / 1000}")"
              else
                echo "| $name | Failed/not run |"
              fi
            done
            echo
            echo "### LVGL 9.6 + HUB75 (same runner)"
            echo
            echo "| Measurement | Seconds |"
            echo "| --- | ---: |"
            for item in "initial:$LVGL_INITIAL_MS" "clean:$LVGL_CLEAN_MS" "no-change:$LVGL_INCREMENTAL_MS"; do
              name="${item%%:*}"
              value="${item#*:}"
              if [[ -n "$value" ]]; then
                printf '| %s | %.2f |\n' "$name" "$(awk "BEGIN {print $value / 1000}")"
              else
                echo "| $name | Failed/not run |"
              fi
            done
            echo
            echo "LVGL C/C++ source files compiled: **${LVGL_COMPILED_SOURCES:-n/a}** (maximum 140)."
            echo
            echo "### RAM and flash usage (bytes)"
            echo
            echo "| Environment | RAM | Flash |"
            echo "| --- | ---: | ---: |"
            for variant in baseline hub75 lvgl; do
              file="/tmp/${variant}_size.txt"
              if [[ -f "$file" ]]; then
                ram=$(sed -n 's/.*RAM:.*used \([0-9][0-9]*\) bytes.*/\1/p' "$file" | tail -1)
                flash=$(sed -n 's/.*Flash:.*used \([0-9][0-9]*\) bytes.*/\1/p' "$file" | tail -1)
                echo "| $variant | ${ram:-n/a} | ${flash:-n/a} |"
              fi
            done
            echo
            echo "Times are wall-clock measurements on GitHub-hosted Ubuntu; local Windows timings may differ."
          } >> "$GITHUB_STEP_SUMMARY"
