[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp>

; Separate opt-in qualification environment. Baseline remains untouched.
[env:esp32dev-hub75]
extends = env:esp32dev
build_src_filter = +<hub75_demo.cpp>
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.0.10
build_flags =
    -DNO_GFX=1
    -DPIXEL_COLOR_DEPTH_BITS=6
