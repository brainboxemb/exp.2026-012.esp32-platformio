[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp>

; Keep the proven five-panel DMA qualification independent from LVGL.
[env:esp32dev-hub75]
extends = env:esp32dev
build_src_filter = +<hub75_demo.cpp>
lib_deps =
    https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#3.0.10
build_flags =
    -DNO_GFX=1
    -DPIXEL_COLOR_DEPTH_BITS=6

; Third opt-in level: same HUB75 wiring plus tightly configured LVGL.
; No Arduino GFX, WiFi, LVGL widgets other than labels, demos or themes.
[env:esp32dev-hub75-lvgl]
extends = env:esp32dev-hub75
extra_scripts = pre:scripts/lvgl_source_filter.py
build_src_filter = +<hub75_lvgl_demo.cpp>
lib_deps =
    ${env:esp32dev-hub75.lib_deps}
    https://github.com/lvgl/lvgl.git#v9.6.0
build_flags =
    ${env:esp32dev-hub75.build_flags}
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
